<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trae 账单/用量 分析</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>

<body>

<div class="container">
    <h1>Trae 账单/用量 分析</h1>
    <p style="color: var(--text-sub); font-size: 16px; margin-bottom: 20px; line-height: 1.6;">
        💡 数据来源：在个人信息 Usage 页面中，打开浏览器开发者工具（F12），找到 <code>query_user_usage_group_by_session</code> 接口，复制响应中 <code>user_usage_group_by_sessions</code> 字段的数组数据，粘贴到下方输入框中。
    </p>
    <div class="input-section">
        <h2>数据输入区</h2>
        <div id="batchesContainer">
            <!-- 动态生成的输入框将放在这里 -->
        </div>

        <div class="controls">
            <button class="btn-add" onclick="addBatchInput()">+ 添加新的数据项</button>
            <button class="btn-secondary" onclick="clearAllBatches()">清空所有</button>
            <button class="btn-primary" onclick="processAllData()">开始分析</button>
        </div>
        <div id="globalErrorMsg" class="error-msg"></div>
    </div>

    <div id="resultSection" style="display: none;">
        <h2>📊 汇总统计</h2>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">总费用 (USD)</div>
                <div class="stat-value total-cost-val" id="totalCost">-$0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">累计 Token</div>
                <div class="stat-value" id="totalToken">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">总记录数</div>
                <div class="stat-value" id="totalCount">0</div>
            </div>
        </div>

        <div class="chart-row">
            <div class="stat-card chart-card">
                <div class="stat-label">模型调用统计</div>
                <div id="modelChartContainer" class="model-chart"></div>
            </div>
        </div>

        <h2>📦 分数据项详情</h2>
        <div id="batchStatsContainer" class="batch-stats-container">
            <!-- 动态生成 -->
        </div>

        <!-- 筛选区域 -->
        <div class="filter-section">
            <div class="filter-group">
                <label for="startDate">开始日期:</label>
                <input type="date" id="startDate">
            </div>
            <div class="filter-group">
                <label for="endDate">结束日期:</label>
                <input type="date" id="endDate">
            </div>
            <button class="btn-apply-filter" onclick="applyDateFilter()">应用筛选</button>
            <button class="btn-reset-filter" onclick="resetDateFilter()">重置</button>
            <span id="filterStatus" style="font-size: 13px; color: var(--text-sub); margin-left: auto;"></span>
        </div>

        <!-- 合并列表 -->
        <h2>📋 详细记录 (按时间倒序)</h2>
        <div class="table-container">
            <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>来源数据项</th>
                        <th>使用时间</th>
                        <th>模型名称</th>
                        <th>Token 详情</th>
                        <th>费用 (USD)</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- 数据行 -->
                </tbody>
            </table>
            </div>
        </div>
    </div>
</div>

<script src="modelChart.js"></script>
<script src="main.js"></script>

</body>
</html>
